spring.datasource.driver-class-name=org.h2.Driver
#Mode=MySQL permette l'uso di @Id @GeneratedValue(strategy = GenerationType.IDENTITY)
#NON_KEYWORDS è utilizzato per escludere alcune parole presenti nelle tabelle di epas
spring.datasource.url=jdbc:h2:mem:db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=month,year,value,day
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=it.cnr.iit.epas.tests.OurH2Dialect

spring.main.allow-circular-references=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.iit.cnr.it/auth/realms/testing

#logging
logging.level.it.cnr.iit.epas=DEBUG
## epas-meal-ticket-service: epas-service verifica i permessi dell'utente e lo chiama con le
## proprie credenziali (client credentials)
epas.meal-ticket-service.url=${EPAS_MEAL_TICKET_SERVICE_URL:http://localhost:8088}
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/epas/protocol/openid-connect/token}
spring.security.oauth2.client.registration.epas-meal-ticket-service.provider=keycloak
spring.security.oauth2.client.registration.epas-meal-ticket-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.epas-meal-ticket-service.client-id=epas-service
spring.security.oauth2.client.registration.epas-meal-ticket-service.client-secret=${EPAS_SERVICE_CLIENT_SECRET:}
